# Test-specific configuration
spring.application.name=Nexus
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=nexus-test

# JWT Configuration
nexus.app.jwtSecret=nexusSecretKeyForAuthenticationAndAuthorization2024SuperSecureKeyWith512BitsMinimumRequiredForHS512AlgorithmJWTSecurityStandardCompliance
nexus.app.jwtExpirationMs=86400000

# Server Configuration
server.port=0

# Socket.IO Configuration - DISABLED FOR TESTS
socketio.server.host=localhost
socketio.server.port=9093
socketio.server.enabled=false

# Logging
logging.level.com.Nexus.Nexus=DEBUG
logging.level.org.springframework.security=DEBUG

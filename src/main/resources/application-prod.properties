# Production Environment Configuration
# Copy this to application-prod.properties for production deployment

spring.application.name=Nexus
server.port=${PORT:8080}

# Production Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexus_prod}

# JWT Configuration - USE ENVIRONMENT VARIABLES IN PRODUCTION
nexus.app.jwtSecret=${JWT_SECRET:nexusSecretKeyForAuthenticationAndAuthorization2024SuperSecureKeyWith512BitsMinimumRequiredForHS512AlgorithmJWTSecurityStandardCompliance}
nexus.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Socket.IO Configuration
socketio.server.host=${SOCKETIO_HOST:0.0.0.0}
socketio.server.port=${SOCKETIO_PORT:9092}
socketio.server.enabled=true

# Production Logging
logging.level.com.Nexus.Nexus=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework=WARN
logging.level.org.mongodb=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.enabled=true

# Document Processing Configuration
app.upload.dir=${UPLOAD_DIR:uploads}
app.base-url=${BASE_URL:https://your-domain.com}
app.document.max-file-size=${DOC_MAX_SIZE:10485760}
app.document.allowed-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/gif

# Production Payment Configuration - SET REAL VALUES IN ENVIRONMENT
payment.stripe.api-key=${STRIPE_API_KEY:sk_live_your_stripe_key}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}
payment.default-currency=${DEFAULT_CURRENCY:USD}
payment.transaction-fee-percentage=${TRANSACTION_FEE:0.029}
payment.fixed-fee=${FIXED_FEE:0.30}

# Security Headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Production Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mongo.enabled=true
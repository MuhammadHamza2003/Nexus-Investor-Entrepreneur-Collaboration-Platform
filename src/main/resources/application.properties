spring.application.name=Nexus
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=nexus

# JWT Configuration
nexus.app.jwtSecret=nexusSecretKeyForAuthenticationAndAuthorization2024SuperSecureKeyWith512BitsMinimumRequiredForHS512AlgorithmJWTSecurityStandardCompliance
nexus.app.jwtExpirationMs=86400000

# Server Configuration
server.port=8080

# Socket.IO Configuration
socketio.server.host=localhost
socketio.server.port=9092
socketio.server.enabled=true

# Logging
logging.level.com.Nexus.Nexus=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Document Processing Configuration
app.upload.dir=uploads
app.base-url=http://localhost:8080
app.document.max-file-size=10485760

# Payment Configuration
payment.stripe.api-key=sk_test_...
payment.stripe.webhook-secret=whsec_...
payment.default-currency=USD
payment.transaction-fee-percentage=0.029
payment.fixed-fee=0.30

# Email Configuration for 2FA (Mock SMTP Settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 2FA Configuration
app.2fa.otp-expiry-minutes=5
app.2fa.otp-length=6
app.2fa.max-attempts=3

app.document.allowed-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/gif